name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # for the coverage report comment on PRs
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx vitest run --coverage --coverage.include='app/**' --coverage.reporter=json-summary --coverage.reporter=json --coverage.reporter=text
      - name: Coverage report comment
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@2500dafcee7dd64f85ab689c0b83798a8359770e # v2.9.3

  vendor:
    name: Vendored bundle matches its source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:vendor
      # esbuild output is byte-stable for a pinned version, so a fresh build must
      # reproduce the committed artifact exactly. Catches a hand-edited bundle, or
      # an SDK bump landed without rebuilding. --stat keeps a mismatch from dumping
      # 218 kB of minified diff into the log.
      - name: Fail if app/vendor/ is out of date
        run: |
          # --porcelain (not `git diff`) so an untracked or deleted artifact fails
          # too, rather than passing vacuously because there is nothing to diff.
          if [ -n "$(git status --porcelain -- app/vendor/)" ]; then
            git status --short -- app/vendor/
            git diff --stat -- app/vendor/
            echo "::error::app/vendor/ does not match a fresh build. Run 'npm run build:vendor' and commit the result. See app/vendor/README.md."
            exit 1
          fi
