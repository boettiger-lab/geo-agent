name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - '.github/workflows/gh-pages.yml'

  # Allow manual trigger. Dispatching on a `preview/*` branch also publishes
  # that branch's app/ at /preview/ — see the "Stage app preview" step and
  # preview/README.md.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress docs
        run: npm run docs:build

      # Browser-bound modules (map, chat UI, layout) have no test harness, so
      # they are verified by eye. Dispatching this workflow on a `preview/*`
      # branch stages that branch's app/ into the built docs tree, giving a
      # real browser URL for an unmerged change.
      #
      # The app is served as-is: app/index.html imports main.js relatively, so
      # nothing is pinned and no downstream app is involved. app/config.json is
      # gitignored and therefore never checked out — previews carry no secrets
      # and have no LLM configured.
      #
      # Staged after the docs build so it survives it, and into a subdirectory
      # so the docs keep their own URLs.
      - name: Stage app preview
        if: startsWith(github.ref, 'refs/heads/preview/')
        run: |
          set -euo pipefail
          dest=docs/.vitepress/dist/preview
          if [ -e "$dest" ]; then
            echo "::error::$dest already exists in the docs build; pick another path"
            exit 1
          fi
          mkdir -p "$dest"
          cp -R app/. "$dest/"
          # Overlay the fixture: layers-input.json replaces app/'s, and any
          # assets beside it (placeholder logos, images the config points at)
          # land next to it so relative paths resolve. preview/README.md is
          # documentation, not part of the served app.
          find preview -maxdepth 1 -type f ! -name README.md -exec cp {} "$dest/" \;
          test -f "$dest/layers-input.json"
          test ! -e "$dest/config.json"
          echo "Staged ${GITHUB_REF_NAME} (${GITHUB_SHA}) at /preview/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
