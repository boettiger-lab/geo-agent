name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - '.github/workflows/gh-pages.yml'

  # Allow manual trigger. Dispatching on a `preview/*` branch also publishes
  # that branch's app/ at /preview/ — see the "Stage app preview" step and
  # preview/README.md.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress docs
        run: npm run docs:build

      # Browser-bound modules (map, chat UI, layout) have no test harness, so
      # they are verified by eye. Every `preview/*` branch is staged into the
      # built docs tree, giving each a real browser URL for an unmerged change.
      #
      # All of them, every time — not just the branch that triggered the run.
      # Pages has a single deployment slot, so a build that staged only one
      # branch silently took every other preview offline, and a routine push
      # to main took them all. Rebuilding the full set on each deploy makes
      # previews additive instead of mutually exclusive.
      #
      # Apps are served as-is: app/index.html imports main.js relatively, so
      # nothing is pinned and no downstream app is involved. app/config.json is
      # gitignored and never checked out — previews carry no secrets.
      - name: Stage app previews
        env:
          PREVIEW_ROOT: docs/.vitepress/dist/preview
        run: |
          set -euo pipefail

          git fetch --no-tags --depth=1 origin \
            "+refs/heads/preview/*:refs/remotes/origin/preview/*" || true

          branches=$(git for-each-ref --format='%(refname:short)' \
            refs/remotes/origin/preview | sed 's|^origin/||')

          if [ -z "$branches" ]; then
            echo "No preview/* branches; publishing the docs alone."
            exit 0
          fi

          # Each branch is staged from a detached worktree, so the docs build
          # already in the working tree is never disturbed.
          for branch in $branches; do
            slug=$(printf '%s' "${branch#preview/}" | tr -c 'A-Za-z0-9._-' '-')
            dest="$PREVIEW_ROOT/$slug"
            work=$(mktemp -d)

            if ! git worktree add --detach "$work" "origin/$branch" >/dev/null 2>&1; then
              echo "::warning::could not check out $branch; skipping"
              rm -rf "$work"
              continue
            fi

            if [ ! -d "$work/app" ]; then
              echo "::warning::$branch has no app/; skipping"
              git worktree remove --force "$work"
              continue
            fi

            mkdir -p "$dest"
            cp -R "$work/app/." "$dest/"
            # Fixture config and any assets beside it, but not its README.
            if [ -d "$work/preview" ]; then
              find "$work/preview" -maxdepth 1 -type f ! -name README.md \
                -exec cp {} "$dest/" \;
            fi
            test ! -e "$dest/config.json"

            # Variants: preview/variants/<name>.json is a shallow patch over
            # the fixture, published beside it so two configurations can be
            # compared side by side without duplicating the whole file.
            for patch in "$work"/preview/variants/*.json; do
              [ -e "$patch" ] || continue
              vname=$(basename "$patch" .json)
              vdest="$dest/$vname"
              mkdir -p "$vdest"
              cp -R "$work/app/." "$vdest/"
              find "$work/preview" -maxdepth 1 -type f ! -name README.md \
                -exec cp {} "$vdest/" \;
              python3 - "$vdest/layers-input.json" "$patch" <<'PYEOF'
          import json, sys
          target, patch = sys.argv[1], sys.argv[2]
          base = json.load(open(target))
          base.update(json.load(open(patch)))
          json.dump(base, open(target, 'w'), indent=2)
          PYEOF
              test ! -e "$vdest/config.json"
              echo "  /preview/$slug/$vname/"
            done

            git worktree remove --force "$work"
            echo "Staged $branch at /preview/$slug/"
          done

          # An index, so a reviewer handed the bare /preview/ URL can find
          # whichever branch they were sent.
          #
          # It lists each branch's variants and any extra HTML staged beside
          # the app, not just the branch root. A branch root is always the
          # live app, so a feature whose artifact is a separate page — an
          # exported document, say — looks absent from the index even when it
          # is published. Everything staged should be reachable from here.
          {
            echo '<!doctype html><meta charset=utf-8><title>Previews</title>'
            echo '<style>body{font:16px/1.5 system-ui,sans-serif;margin:3rem auto;max-width:36rem;padding:0 1rem}'
            echo 'h1{font-size:1.4rem}li{margin:.5rem 0}code{color:#666;font-size:.85em}'
            echo 'ul ul{margin:.2rem 0 0;font-size:.92em}</style>'
            echo '<h1>Branch previews</h1><ul>'
            for branch in $branches; do
              slug=$(printf '%s' "${branch#preview/}" | tr -c 'A-Za-z0-9._-' '-')
              dir="$PREVIEW_ROOT/$slug"
              [ -d "$dir" ] || continue
              echo "<li><a href=\"./$slug/\">$slug</a> &mdash; <code>$branch</code>"
              echo '<ul>'
              # Variants: a subdirectory that is itself an app.
              for v in "$dir"/*/; do
                [ -f "$v/index.html" ] || continue
                vname=$(basename "$v")
                echo "<li><a href=\"./$slug/$vname/\">$vname</a> &mdash; variant</li>"
              done
              # Extra pages staged from preview/, e.g. an exported document.
              for f in "$dir"/*.html; do
                [ -e "$f" ] || continue
                fname=$(basename "$f")
                [ "$fname" = "index.html" ] && continue
                echo "<li><a href=\"./$slug/$fname\">$fname</a> &mdash; page</li>"
              done
              echo '</ul></li>'
            done
            echo '</ul>'
          } > "$PREVIEW_ROOT/index.html"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
